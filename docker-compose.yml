# Base de datos de clientes del asistente de Uniformes M.
#   docker compose up -d --build
# API: http://localhost:3000
# Adminer (ver la base), con PostgreSQL ya elegido:
#   http://localhost:8080/?pgsql=db&username=uniformes&db=uniformes
#   (si entrás por http://localhost:8080, elegí Motor "PostgreSQL" y Servidor "db"; la clave está en .env)
# Las claves van en .env (copiar .env.example).
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniformes
      POSTGRES_USER: uniformes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniformes -d uniformes"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://uniformes:${POSTGRES_PASSWORD}@db:5432/uniformes
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Falta ADMIN_TOKEN en .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,https://uniformesm.onrender.com}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # Solo accesible desde esta computadora. Para publicarla, ponerla detrás de un proxy con HTTPS.
    ports:
      - "127.0.0.1:3000:3000"

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
