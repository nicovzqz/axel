<style>
/* Layout: una barra fija con pestañas; cada portfolio vive en su propio iframe y la calculadora es una hoja con ticket al costado. */
:root{
  --bg:#EEF1F6;--hoja:#FFFFFF;--tinta:#14305F;--suave:#51658A;--linea:#14305F;--borde:#CBD5E3;--marca:#D2331F;--marca-fg:#FFFFFF;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --mono:'IBM Plex Mono','Consolas',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D2145;--hoja:#112A55;--tinta:#E8F0FB;--suave:#A6BBDA;--linea:#BDD0EA;--borde:#2A4676;--marca:#FF8A6B;--marca-fg:#0D2145;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D2145;--hoja:#112A55;--tinta:#E8F0FB;--suave:#A6BBDA;--linea:#BDD0EA;--borde:#2A4676;--marca:#FF8A6B;--marca-fg:#0D2145;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tinta);font:400 16px/1.5 var(--display)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}

.bar{flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;background:var(--hoja);border-bottom:1.5px solid var(--linea);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:800 18px/1 var(--display);font-stretch:120%}
.tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.tabs button{background:transparent;border:1.5px solid transparent;padding:7px 11px;font:500 14px/1 var(--mono);cursor:pointer}
.tabs button:hover{border-color:var(--linea)}
.tabs button[aria-selected=true]{background:var(--tinta);color:var(--hoja);border-color:var(--tinta)}
.tabs .calc-tab{border-color:var(--marca);color:var(--marca);font-weight:600}
.tabs .calc-tab[aria-selected=true]{background:var(--marca);color:var(--marca-fg);border-color:var(--marca)}

main{flex:1;min-height:0;position:relative}
iframe{display:block;width:100%;height:100%;border:0}
#calculadora{height:100%;overflow-y:auto}
.calc-in{max-width:1040px;margin-inline:auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.calc-in h1{margin:0 0 6px;font:800 clamp(30px,5vw,50px)/1.04 var(--display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance}
.intro{margin:0 0 24px;color:var(--suave);max-width:38em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:24px;align-items:start}
form{display:grid;gap:18px;background:var(--hoja);border:1.5px solid var(--linea);padding:22px;min-width:0}
.campo{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
.campo>label,.campo>legend{font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);padding:0}
.campo legend{margin-bottom:6px}
select,input[type=number]{width:100%;padding:10px;background:var(--bg);border:1.5px solid var(--linea);border-radius:0;font-size:17px}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin:3px 0 0;flex:none;accent-color:var(--marca)}
.aviso{margin:0;font-size:14px;line-height:1.4}
#aviso{color:var(--marca);font-weight:600}
#escala{color:var(--suave)}

.ticket{background:var(--hoja);border:1.5px solid var(--linea);padding:22px;font-family:var(--mono);font-size:14px;min-width:0}
.ticket h2{margin:0 0 3px;font:600 13px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ticket .detalle{margin:0 0 14px;color:var(--suave);font-size:13px;line-height:1.4}
.ticket dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px;border-block:1px dashed var(--suave);padding-block:12px}
.ticket dt{margin:0}
.ticket dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:14px 4px}
.total span{font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.total b{font:800 clamp(30px,4.4vw,40px)/1.05 var(--display);font-variant-numeric:tabular-nums}
.sub{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding-top:5px}
.legal{margin:16px 0 0;color:var(--suave);font-size:12.5px;line-height:1.45}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.dos{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

<main>
  <iframe id="promo" title="Portfolio Promo" srcdoc="<!doctype html><html lang=&quot;es&quot;><head><meta charset=&quot;utf-8&quot;><meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Hilván Promo</title>

<style>
/* Layout: colegial y ruidoso. Bandas de color llenas, con el buzo editable como protagonista del primer pantallazo. */
:root{
  color-scheme:light;
  --azul:#1B2FD0;--amarillo:#FFD21E;--rosa:#FF5C95;--papel:#F1F2FF;--tinta:#0C1250;--blanco:#FFFFFF;
  --display:'Alfa Slab One','Rockwell',Georgia,serif;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--papel);color:var(--tinta);font:500 17px/1.5 var(--body);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.02;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

.top{background:var(--azul);color:var(--blanco)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px}
.logo{font:400 26px/1 var(--display);text-decoration:none}
.logo span{color:var(--amarillo)}
.bar nav{display:flex;gap:20px;flex-wrap:wrap;font:700 18px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.bar nav a{text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px}
.bar nav a:hover{border-color:var(--amarillo)}

.hero{background:var(--azul);color:var(--blanco);padding-bottom:64px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-top:24px}
.hero h1{font-size:clamp(46px,7.4vw,96px);letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--amarillo)}
.hero-copy{display:grid;gap:24px;justify-items:start}
.lead{font-size:20px;max-width:32em}
.deadline{display:inline-block;background:var(--rosa);color:var(--tinta);font:800 21px/1.15 var(--cond);letter-spacing:.02em;text-transform:uppercase;padding:12px 16px;transform:rotate(-1.5deg)}

.lab{background:var(--amarillo);color:var(--tinta);padding:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;box-shadow:10px 10px 0 var(--tinta)}
.lab svg{width:100%;height:auto;display:block}
.ctrls{display:grid;gap:16px;min-width:0}
.ctrls label,.ctrls .lbl{display:block;font:800 16px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.ctrls input{width:100%;padding:10px;border:3px solid var(--tinta);background:var(--blanco);border-radius:0;font:700 20px/1 var(--cond);text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:34px;height:34px;padding:0;border:3px solid var(--tinta);cursor:pointer;background:var(--c)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--amarillo),0 0 0 6px var(--tinta)}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{flex:1;min-width:44px;background:transparent;border:3px solid var(--tinta);margin-left:-3px;padding:7px 0;font:800 19px/1 var(--cond);cursor:pointer}
.seg button:first-child{margin-left:0}
.seg button[aria-pressed=true]{background:var(--tinta);color:var(--amarillo)}
.summary{font:600 17px/1.25 var(--cond);min-height:2.5em}
.btn{display:inline-block;background:var(--tinta);color:var(--amarillo);border:0;text-decoration:none;text-align:center;font:800 20px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:14px 18px;cursor:pointer}
.btn:hover{background:var(--rosa);color:var(--tinta)}

.tick{background:var(--tinta);color:var(--amarillo);overflow:hidden;white-space:nowrap;font:800 22px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding-block:14px}
.tick div{display:inline-block;animation:slide 38s linear infinite}
.tick span{padding-inline:18px}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick div{animation:none}html{scroll-behavior:auto}}

section{padding-block:72px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(36px,5vw,62px);color:var(--azul)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{background:transparent;border:3px solid var(--tinta);padding:8px 14px;font:800 18px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--tinta);color:var(--amarillo)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.work{display:grid;grid-template-rows:auto 1fr;background:var(--blanco);border:3px solid var(--tinta)}
.work figure{margin:0;padding:18px 36px;background:var(--t);border-bottom:3px solid var(--tinta)}
.work svg{width:100%;height:auto;display:block}
.work .txt{padding:16px 18px;display:grid;gap:6px;align-content:start}
.work h3{font-size:24px}
.work .meta{font:600 17px/1.25 var(--cond);letter-spacing:.02em}
.kind{font:800 15px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--azul)}

.steps{background:var(--amarillo)}
.steps h2{font-size:clamp(36px,5vw,62px);margin-bottom:32px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;counter-reset:s}
.steps li{counter-increment:s;display:grid;gap:8px;align-content:start;border-top:5px solid var(--tinta);padding-top:12px;min-width:0}
.steps li::before{content:counter(s);font:400 48px/1 var(--display);color:var(--azul)}
.steps h3{font:800 24px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.steps p{font-size:16px;line-height:1.4}

.contact{background:var(--azul);color:var(--blanco)}
.contact .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.contact h2{font-size:clamp(38px,5.4vw,70px);color:var(--amarillo);margin-bottom:20px}
.contact dl{display:grid;gap:12px;margin:24px 0 0}
.contact dt{font:800 15px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--amarillo)}
.contact dd{margin:3px 0 0;font-size:20px;font-weight:600}
form{display:grid;gap:14px;background:var(--papel);color:var(--tinta);padding:24px;box-shadow:10px 10px 0 var(--rosa)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
form label{display:grid;gap:5px;font:800 16px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
form input,form textarea{width:100%;padding:10px;border:3px solid var(--tinta);border-radius:0;background:var(--blanco);font:500 17px/1.35 var(--body);letter-spacing:0;text-transform:none}
#gracias{font-weight:600;margin:0}
footer{background:var(--tinta);color:var(--papel);padding-block:22px;font-size:15px}

@media (max-width:980px){
  .hero-grid,.contact .cols{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps ol{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .lab{grid-template-columns:minmax(0,1fr);box-shadow:6px 6px 0 var(--tinta)}
  .lab svg{max-width:300px;margin-inline:auto}
  .grid,.steps ol,.two{grid-template-columns:minmax(0,1fr)}
  form{box-shadow:6px 6px 0 var(--rosa)}
  section{padding-block:52px}
}
</style>

<div class=&quot;hero&quot; id=&quot;inicio&quot;>
  <div class=&quot;wrap hero-grid&quot;>

<script>
const NAMES='Juana Sol Tomi Lucho Mili Facu Cami Nacho Flor Santi Pili Tobi Rochi Gonza Male Bauti Vicky Joaco Abril Fran'.split(' ');
const esc=s=>String(s).replace(/[&amp;<>&quot;]/g,c=>({'&amp;':'&amp;amp;','<':'&amp;lt;','>':'&amp;gt;','&quot;':'&amp;quot;'}[c]));
let uid=0;

function numberBlock(n,ink,y,size){
  const id='n'+(++uid);let rows='';
  for(let ry=y-size*.78,i=uid;ry<y+6;ry+=7.4,i+=3){
    let line='';for(let k=0;k<14;k++)line+=NAMES[(i+k*7)%NAMES.length]+' ';
    rows+=`<text x=&quot;74&quot; y=&quot;${ry.toFixed(1)}&quot; font-size=&quot;7.4&quot;>${line}</text>`;
  }
  const num=`x=&quot;150&quot; y=&quot;${y}&quot; font-size=&quot;${size}&quot; text-anchor=&quot;middle&quot; font-family=&quot;'Alfa Slab One',Rockwell,serif&quot;`;
  return `<clipPath id=&quot;${id}&quot;><text ${num}>${n}</text></clipPath>
    <text ${num} fill=&quot;${ink}&quot; opacity=&quot;.28&quot;>${n}</text>
    <g clip-path=&quot;url(#${id})&quot; fill=&quot;${ink}&quot; font-family=&quot;'Barlow Condensed',Arial,sans-serif&quot; font-weight=&quot;700&quot;>${rows}</g>`;
}
function backText(o){
  const a=esc(o.apodo||'').toUpperCase(),sz=a.length<=6?30:a.length<=9?23:18;
  return `<text x=&quot;150&quot; y=&quot;${o.top}&quot; text-anchor=&quot;middle&quot; font-family=&quot;'Barlow Condensed',Arial,sans-serif&quot; font-weight=&quot;800&quot; font-size=&quot;${sz}&quot; letter-spacing=&quot;1&quot; fill=&quot;${o.ink}&quot;>${a}</text>
    ${numberBlock(o.promo,o.ink,o.top+102,92)}
    <text x=&quot;150&quot; y=&quot;${o.top+126}&quot; text-anchor=&quot;middle&quot; font-family=&quot;'Barlow Condensed',Arial,sans-serif&quot; font-weight=&quot;800&quot; font-size=&quot;15&quot; letter-spacing=&quot;5&quot; fill=&quot;${o.ink}&quot;>PROMO</text>

</article>`).join('');
['Todas','Remeras','Chombas','Buzos','Camperas'].forEach(c=>{

 +`<div class=&quot;g-row g-axis&quot;><span class=&quot;g-name&quot;>Día</span><div class=&quot;g-track&quot;><span style=&quot;left:0&quot;>0</span><span style=&quot;left:33.33%&quot;>10</span><span style=&quot;left:66.67%&quot;>20</span><span style=&quot;left:100%&quot;>30</span></div></div>`;

  document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s.dataset.c===it.c));
}

<script>
/* PRECIOS DE EJEMPLO: cambiá estos valores por los reales. Todos están en pesos, por unidad. */
const PRECIOS={
  prendas:[
    {id:'remera',  nombre:'Remera cuello redondo',precio:14000,minimo:30},
    {id:'oversize',nombre:'Remera oversize',      precio:18000,minimo:30},
    {id:'chomba',  nombre:'Chomba de piqué',      precio:22000,minimo:30},
    {id:'canguro', nombre:'Buzo canguro',         precio:42000,minimo:15},
    {id:'redondo', nombre:'Buzo cuello redondo',  precio:36000,minimo:30},
    {id:'campera', nombre:'Campera con capucha',  precio:52000,minimo:30}
  ],
  estampados:[
    {id:'ninguno',   nombre:'Sin estampado',precio:0,   minimo:0},
    {id:'serigrafia',nombre:'Serigrafía',   precio:3500,minimo:30},
    {id:'dtf',       nombre:'DTF',          precio:5000,minimo:10},
    {id:'bordado',   nombre:'Bordado',      precio:4500,minimo:15}
  ],
  apodo:2500,
  descuentos:[{desde:300,pct:15},{desde:100,pct:10},{desde:50,pct:5}],
  sena:.5
};

/* Calcula el presupuesto. No toca la página, así se puede probar por separado. */
function calcular({prenda,estampado,cantidad,lugares,apodo},P=PRECIOS){
  const pr=P.prendas.find(x=>x.id===prenda),es=P.estampados.find(x=>x.id===estampado);
  const lug=es.precio?lugares:0;
  const unitario=pr.precio+es.precio*lug+(apodo?P.apodo:0);
  const bruto=unitario*cantidad;
  const pct=(P.descuentos.find(d=>cantidad>=d.desde)||{pct:0}).pct;
  const descuento=Math.round(bruto*pct/100);
  const total=bruto-descuento;
  return {pr,es,lug,bruto,pct,descuento,total,
    porPrenda:cantidad?Math.round(total/cantidad):0,sena:Math.round(total*P.sena),
    minimo:Math.max(pr.minimo,es.minimo)};
}

const $=id=>document.getElementById(id);
const pesos=n=>'$'+Math.round(n).toLocaleString('es-AR');
$('c-prenda').innerHTML=PRECIOS.prendas.map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');
$('c-tec').innerHTML=PRECIOS.estampados.map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');
$('c-prenda').value='canguro';$('c-tec').value='bordado';

function actualizar(){
  const crudo=Number($('c-cant').value);
  const valida=Number.isInteger(crudo)&&crudo>0;
  const cantidad=valida?crudo:0;
  const estampado=$('c-tec').value;
  $('c-ubic').disabled=estampado==='ninguno';
  const r=calcular({prenda:$('c-prenda').value,estampado,cantidad,lugares:+$('c-ubic').value,apodo:$('c-apodo').checked});

  $('t-detalle').textContent=`${cantidad} × ${r.pr.nombre}. ${r.es.nombre}.`;
  const filas=[[`Prenda, ${pesos(r.pr.precio)} c/u`,r.pr.precio*cantidad]];
  if(r.lug)filas.push([`${r.es.nombre}, ${r.lug} ${r.lug>1?'lugares':'lugar'}`,r.es.precio*r.lug*cantidad]);
  if($('c-apodo').checked)filas.push([`Apodos, ${pesos(PRECIOS.apodo)} c/u`,PRECIOS.apodo*cantidad]);
  if(r.descuento)filas.push([`Descuento por cantidad, ${r.pct}%`,-r.descuento]);
  $('t-lineas').innerHTML=filas.map(([k,v])=>`<dt>${k}</dt><dd>${v<0?'−'+pesos(-v):pesos(v)}</dd>`).join('');
  $('t-total').textContent=pesos(r.total);
  $('t-unidad').textContent=pesos(r.porPrenda);
  $('t-sena').textContent=pesos(r.sena);

  const aviso=$('aviso');
  if(!valida){aviso.textContent='Ingresá una cantidad entera mayor que cero.';aviso.hidden=false}
  else if(cantidad<r.minimo){aviso.textContent=`El pedido mínimo para esta combinación es de ${r.minimo} prendas.`;aviso.hidden=false}
  else aviso.hidden=true;

  const prox=[...PRECIOS.descuentos].reverse().find(d=>cantidad<d.desde);
  $('escala').textContent=valida&&prox?`Con ${prox.desde-cantidad} prendas más llegás al ${prox.pct}% de descuento.`:'';
}
$('calc').addEventListener('input',actualizar);
$('calc').addEventListener('submit',e=>e.preventDefault());
actualizar();

/* Pestañas */
const VISTAS=['promo','ficha','perchero','calculadora'];
function mostrar(v){
  VISTAS.forEach(x=>{$(x).hidden=x!==v});
  $('tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)mostrar(b.dataset.v)});
if(VISTAS.includes(location.hash.slice(1)))mostrar(location.hash.slice(1));
</script>
