# Blueprint de Render: crea el sitio y la API desde este repositorio.
# Render → New → Blueprint → elegir este repo. Después completar DATABASE_URL (Supabase).
services:
  # API que guarda los clientes del chat en Supabase (PostgreSQL).
  - type: web
    name: uniformes-m-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/salud
    # El bot de WhatsApp lee precios.js y assets/comercial.js: si cambian, también se vuelve a desplegar.
    buildFilter:
      paths:
        - server/**
        - precios.js
        - assets/comercial.js
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      # Supabase → Project Settings → Database → Connection string → "Session pooler" (URI).
      - key: DATABASE_URL
        sync: false
      # Token para consultar clientes (/api/leads, /api/leads.csv, /api/resumen). Render lo genera.
      - key: ADMIN_TOKEN
        generateValue: true
      # Sitios que pueden guardar datos. Sumar el dominio propio cuando esté configurado.
      - key: ALLOWED_ORIGINS
        value: https://uniformesm.onrender.com
      # Bot de WhatsApp (Meta → app → WhatsApp → API Setup / Configuration). Ver DESPLIEGUE.md.
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

  # Sitio público (estático). El dominio propio y el DNS se configuran en Render → Settings → Custom Domains.
  - type: web
    name: uniformesm
    runtime: static
    buildCommand: echo "Sitio estatico, sin build"
    staticPublishPath: .
